<!-- SESSION: logout confirm, logout overlay, welcome chip -->
<div data-include="components/session/session.html"></div>

<!-- AUTH -->
<div id="auth-modal-wrapper">
    <div class="auth-orb orb1"></div><div class="auth-orb orb2"></div><div class="auth-orb orb3"></div>
    <div class="auth-card" id="auth-card">
        <div class="auth-close" onclick="window.auth.hideAuth()"><i class="fa-solid fa-xmark"></i></div>
        <div class="app-logo-icon"><span class="logo-ring"></span><i class="fa-solid fa-gamepad"></i></div>
        <h1 class="app-title">FF Cash Battle</h1>
        <p class="auth-sub" id="auth-sub">Login to play matches &amp; win</p>

        <div class="auth-tabs" id="auth-tabs" data-active="login">
            <span class="auth-tab-pill"></span>
            <button type="button" class="auth-tab active" data-tab="login" onclick="auth.switch('login')">Login</button>
            <button type="button" class="auth-tab" data-tab="register" onclick="auth.switch('register')">Sign Up</button>
        </div>

        <div class="auth-forms" id="auth-forms">
<div data-include="pages/login/login.html"></div>
<div data-include="pages/register/register.html"></div>
        </div>

        <!-- success overlay (login / sign up) -->
        <div class="auth-done" id="auth-done">
            <svg viewBox="0 0 60 60" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle class="ad-circle" cx="30" cy="30" r="26"/><path class="ad-check" d="M18 31l9 9 16-18"/></svg>
            <h3 id="auth-done-title">Welcome back!</h3>
            <p id="auth-done-sub">Logging you in…</p>
        </div>
    </div>
</div>

<!-- APP -->
<div id="app-interface">

<div data-include="components/drawer/drawer.html"></div>

<div data-include="components/header/header.html"></div>
