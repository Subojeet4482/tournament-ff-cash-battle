<header>
    <div style="font-size:1.5rem; cursor:pointer;" onclick="app.gearClick(this)"><i id="header-gear" class="fa-solid fa-gear" style="color:var(--primary);"></i></div>
    <div style="display:flex; flex-direction:column; align-items:center; line-height:1.15;">
        <div class="app-brand-title">FF Cash Battle</div>
        <div id="header-clock" style="font-size:0.7rem; font-weight:600; color:var(--text-muted); font-family:monospace;">--:--:--</div>
    </div>
    <div class="header-right">
        <div class="notification-btn" onclick="app.openNotifications()">
            <i id="header-bell" class="fa-regular fa-bell"></i>
            <div class="notif-dot" id="notif-dot"></div>
        </div>
        <div class="wallet-pill" onclick="app.checkLogin(() => nav.goto('wallet', document.querySelectorAll('.nav-item')[4]))">
            <img class="coin-ico" src="assets/img/ff-coin.png" alt="FF coin" draggable="false">
            <span id="header-coins" class="bal-fx">Login</span>
            <span class="wallet-plus" title="Add money" onclick="event.stopPropagation(); app.checkLogin(() => ui.openModal('modal-deposit'))">+</span>
        </div>
    </div>
</header>
