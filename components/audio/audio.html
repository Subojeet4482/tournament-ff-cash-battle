<!-- ===== SOUND FILES ===== -->
<!-- File names are case-sensitive on the server: use exactly these lowercase names. -->
<!-- audio-bg (background music) only plays if you add assets/sounds/sound.mp3 — it is optional. -->
<audio id="audio-bg" src="assets/sounds/sound.mp3" loop preload="none"></audio>
<audio id="audio-touch" src="assets/sounds/touch.mp3" preload="auto"></audio>
<audio id="audio-withdrawal" src="assets/sounds/withdrawal.mp3" preload="auto"></audio>
<audio id="audio-notification" src="assets/sounds/notification.mp3" preload="auto"></audio>
<audio id="audio-settings" src="assets/sounds/setting.mp3" preload="auto"></audio>
<audio id="audio-clear" src="assets/sounds/clear.mp3" preload="auto"></audio>
