<!-- 4 BALL MATCH — full-screen game (opened from Chat → Game) -->
<div id="ball" class="bl" aria-hidden="true">
  <div class="bl-bg"></div>
  <div class="bl-top">
    <button type="button" class="bl-back" onclick="ballGame.back()" aria-label="Back"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="bl-title"><img src="assets/img/game/4ball-logo-sm.webp" alt=""><b>4 Ball Match</b></div>
    <div class="bl-wallet" onclick="ballGame.addMoney()"><img src="assets/img/ff-coin.png" alt=""><b id="bl-bal">0</b><i class="fa-solid fa-plus"></i></div>
  </div>

  <!-- LOBBY -->
  <section class="bl-s on" id="bl-lobby">
    <div class="bl-hero"><img src="assets/img/game/4ball-logo.webp" alt="4 Ball Match" draggable="false"></div>
    <div class="bl-me" id="bl-me"></div>
    <div class="bl-lbl">Choose entry <small id="bl-cut"></small></div>
    <div class="bl-entries" id="bl-entries"></div>
    <button type="button" class="bl-play" id="bl-play" onclick="ballGame.play()"><i class="fa-solid fa-angles-right l"></i><span><i class="fa-solid fa-play"></i> <em id="bl-play-t">Play</em></span><i class="fa-solid fa-angles-left r"></i></button>
    <button type="button" class="bl-prac" id="bl-prac" onclick="ballGame.play(true)"><i class="fa-solid fa-flask"></i> Practice free <small id="bl-prac-n"></small></button>
    <div class="bl-how"><b>How to play</b><span>Drop balls into the board. First to line up <b>4 balls</b> — across, down or diagonal — wins the pot. Each turn has a timer. If no real player is found, a <em>BOT</em> joins (always shown with a BOT badge).</span></div>
    <div class="bl-stats" id="bl-stats"></div>
  </section>

  <!-- SEARCH / MATCHED -->
  <section class="bl-s" id="bl-search">
    <div class="bl-vs">
      <div class="bl-pl" id="bls-me"></div>
      <div class="bl-vsb"><span>VS</span></div>
      <div class="bl-pl" id="bls-op"></div>
    </div>
    <div class="bl-ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" class="bg"/><circle cx="50" cy="50" r="44" class="fg" id="bls-ring"/></svg><b id="bls-t">12</b></div>
    <h3 id="bls-h">Finding a real player…</h3><p id="bls-p">Attempt 1 of 2</p>
    <div class="bl-pot" id="bls-pot"></div>
    <div class="bl-btns"><button type="button" class="bl-b2" id="bls-cancel" onclick="ballGame.cancel()">Cancel</button><button type="button" class="bl-b1 hidden" id="bls-retry" onclick="ballGame.retry()"><i class="fa-solid fa-rotate"></i> Try again</button></div>
  </section>

  <!-- PLAY -->
  <section class="bl-s" id="bl-play-s">
    <div class="bl-seat op" id="blp-op"></div>
    <div class="bl-potbar"><img src="assets/img/ff-coin.png" alt=""><span id="blp-pot"></span></div>
    <div class="bl-boardwrap"><div class="bl-cols" id="bl-cols"></div><div class="bl-board" id="bl-board"></div></div>
    <div class="bl-turn" id="bl-turn"></div>
    <div class="bl-seat me" id="blp-me"></div>
    <button type="button" class="bl-leave" onclick="ballGame.leave()"><i class="fa-solid fa-flag"></i> Leave</button>
  </section>

  <!-- RESULT -->
  <div class="bl-res" id="bl-res"></div>
  <div class="bl-toast" id="bl-toast"></div>
</div>
