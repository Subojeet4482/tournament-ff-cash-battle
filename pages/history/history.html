<!-- WALLET HISTORY MODAL (Point 3) -->
<div id="modal-wallet-history" class="modal-wrap">
    <div class="modal-overlay" onclick="ui.closeModal()"></div>
    <div class="modal-sheet">
        <div class="sheet-handle"></div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <div style="display:flex; align-items:center; gap:10px;">
                <div onclick="ui.closeModal()" style="cursor:pointer; font-size:1.2rem;"><i class="fa-solid fa-arrow-left"></i></div>
                <h2 style="margin:0">History</h2>
            </div>
            <div onclick="ui.closeModal()" style="font-size:1.4rem; cursor:pointer; color:var(--text-muted);"><i class="fa-solid fa-xmark"></i></div>
        </div>
        <div class="mm-tabs-wrapper" style="margin:0 0 15px;">
            <div class="mm-tab active" id="wh-tab-withdraw" onclick="app.switchWHTab('withdraw',this)">Withdrawal History</div>
            <div class="mm-tab" id="wh-tab-deposit" onclick="app.switchWHTab('deposit',this)">Deposit History</div>
        </div>
        <div style="font-size:0.72rem; color:var(--text-muted); text-align:center; margin-bottom:10px;">Showing last 7 days only • Older records auto-removed</div>
        <div id="wh-list" style="padding-bottom:20px;"></div>
    </div>
</div>
