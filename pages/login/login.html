        <div id="form-login" class="auth-form">
            <div class="input-group"><i class="fa-solid fa-envelope"></i><input type="email" id="login-email" class="input-box" placeholder="Email Address" autocomplete="email" style="padding-left:45px;" onkeydown="auth.keySubmit(event,'login')" oninput="this.classList.remove('invalid')"></div>
