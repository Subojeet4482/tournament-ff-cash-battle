<!-- ===== WITHDRAWAL SUCCESS MODAL ===== -->
<div id="modal-wd-success" class="modal-wrap" style="z-index:10000;">
    <div class="modal-overlay" onclick="ui.closeModal()"></div>
    <div class="modal-sheet" style="text-align:center; padding:30px 25px; max-width:340px; margin:auto; border-radius:24px;">
        <div class="wd-tick-wrap">
            <div class="wd-tick"><i class="fa-solid fa-check"></i></div>
        </div>
        <h2 id="wd-success-title" style="margin:18px 0 6px; font-size:1.3rem; font-weight:900; color:var(--success);">Withdrawal Request Successful</h2>
        <p id="wd-success-hello" style="margin:0 0 4px; font-weight:700; font-size:1rem;">Hello User</p>
        <p id="wd-success-msg" style="margin:8px 0 18px; color:var(--text-muted); line-height:1.55; font-size:0.92rem;"></p>
        <div style="background:var(--bg-input); border-radius:14px; padding:14px; margin-bottom:14px; text-align:left;">
            <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:0.85rem;"><span style="color:var(--text-muted);">Amount</span><span style="font-weight:800;">₹<span id="wd-success-amt">0</span></span></div>
            <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:0.85rem;"><span style="color:var(--text-muted);">You will receive <small>(after ₹2 fee)</small></span><span style="font-weight:800; color:var(--success);">₹<span id="wd-success-net">0</span></span></div>
            <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:0.85rem;"><span style="color:var(--text-muted);">Method</span><span id="wd-success-method" style="font-weight:700;">--</span></div>
            <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:0.85rem;"><span style="color:var(--text-muted);">Reference ID</span><span id="wd-success-ref" style="font-weight:800; font-family:monospace; letter-spacing:.5px;">--</span></div>
            <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:0.85rem;"><span style="color:var(--text-muted);">Request Date</span><span id="wd-success-date" style="font-weight:700;">--</span></div>
            <div style="display:flex; justify-content:space-between; font-size:0.85rem;"><span style="color:var(--text-muted);">Expected By</span><span id="wd-success-eta" style="font-weight:700; color:var(--success);">--</span></div>
        </div>
        <div class="wd-steps">
            <div class="wd-step done"><i class="fa-solid fa-check"></i><span>Request received</span></div>
            <div class="wd-step now"><i class="fa-solid fa-hourglass-half"></i><span>Under review</span></div>
            <div class="wd-step"><i class="fa-solid fa-paper-plane"></i><span>Money sent</span></div>
        </div>
        <p id="wd-success-foot" style="margin:14px 0 16px; font-size:0.78rem; color:var(--text-muted); line-height:1.5;"></p>
        <button class="btn-main" onclick="ui.closeModal()" style="padding:12px; border-radius:50px;">Done</button>
    </div>
</div>
